name: Deploy service

on:
  repository_dispatch:
    types: [deploy]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Copy .env
        run: cp /home/deploy/.env ${{ github.workspace }}/.env

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | \
          docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Update image tag in .env
        run: |
          SERVICE=${{ github.event.client_payload.service }}
          IMAGE_TAG=${{ github.event.client_payload.image_tag }}
    
          TAG_VAR=$(echo "${SERVICE^^}_TAG")
    
          echo "Setting $TAG_VAR=$IMAGE_TAG"
    
          sed -i "s/^${TAG_VAR}=.*/${TAG_VAR}=${IMAGE_TAG}/" ${{ github.workspace }}/.env
          sed -i "s/^${TAG_VAR}=.*/${TAG_VAR}=${IMAGE_TAG}/" /home/deploy/.env

      - name: Deploy selected service
        run: |
          SERVICE=${{ github.event.client_payload.service }}
          IMAGE_TAG=${{ github.event.client_payload.image_tag }}
    
          echo "Deploying $SERVICE:$IMAGE_TAG"
    
          docker compose pull $SERVICE
          docker compose up -d --no-deps $SERVICE
    
          echo "Successfully deployed $SERVICE:$IMAGE_TAG"