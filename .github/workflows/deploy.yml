name: Deploy service

on:
  repository_dispatch:
    types: [deploy]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_PAT }}" | \
          docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

      - name: Update image tag in .env
        run: |
          SERVICE=${{ github.event.client_payload.service }}
          IMAGE_TAG=${{ github.event.client_payload.image_tag }}

          TAG_VAR=$(echo "${SERVICE^^}_TAG")

          echo "Setting $TAG_VAR=$IMAGE_TAG"

          if grep -q "^${TAG_VAR}=" /home/deploy/.env; then
            sed -i "s/^${TAG_VAR}=.*/${TAG_VAR}=${IMAGE_TAG}/" /home/deploy/.env
          else
            echo "${TAG_VAR}=${IMAGE_TAG}" >> /home/deploy/.env
          fi

      - name: Deploy selected service
        run: |
          SERVICE=${{ github.event.client_payload.service }}
          IMAGE_TAG=${{ github.event.client_payload.image_tag }}

          echo "Deploying $SERVICE:$IMAGE_TAG"

          COMPOSE_FILES=(-f docker-compose.yml)
          GPU_ENABLED=$(grep -E '^SPEECH_SERVICE_GPU_ENABLED=' /home/deploy/.env | tail -n 1 | cut -d= -f2- | tr -d '"[:space:]' | tr '[:upper:]' '[:lower:]' || true)
          if [ "$SERVICE" = "speech_service" ] && { [ "$GPU_ENABLED" = "true" ] || [ "$GPU_ENABLED" = "1" ]; }; then
            echo "Using NVIDIA GPU override for speech_service"
            COMPOSE_FILES+=(-f docker-compose.gpu.yml)
          fi

          docker compose \
            --env-file /home/deploy/.env \
            "${COMPOSE_FILES[@]}" \
            pull $SERVICE

          docker compose \
            --env-file /home/deploy/.env \
            "${COMPOSE_FILES[@]}" \
            up -d --no-deps $SERVICE

          # Если у сервиса есть worker — перезапускаем и его
          WORKER_NAME="${SERVICE}_worker"
          if docker compose \
              --env-file /home/deploy/.env \
              "${COMPOSE_FILES[@]}" \
              config --services | grep -q "^${WORKER_NAME}$"; then
            echo "Found worker $WORKER_NAME, redeploying..."
            docker compose \
              --env-file /home/deploy/.env \
              "${COMPOSE_FILES[@]}" \
              up -d --no-deps $WORKER_NAME
          fi

          docker image prune -a -f

          echo "Successfully deployed $SERVICE:$IMAGE_TAG"
