services:
  auth_service:
    image: ghcr.io/podcast-service/auth_service:${AUTH_SERVICE_TAG:-latest}
    container_name: auth_service
    env_file:
      - /home/deploy/.env
    environment:
      OTEL_SERVICE_NAME: auth_service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=podcast,deployment.environment=${DEPLOYMENT_ENV}
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - podcast-network
      - otel-network

  media_upload_service:
    image: ghcr.io/podcast-service/media_upload_service:${MEDIA_UPLOAD_SERVICE_TAG:-latest}
    container_name: media_upload_service
    env_file:
      - /home/deploy/.env
    environment:
      OTEL_SERVICE_NAME: media_upload_service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=podcast,deployment.environment=${DEPLOYMENT_ENV}
    expose:
      - "8081"
    volumes:
      - media-tmp:/tmp/media_uploads
    restart: unless-stopped
    networks:
      - podcast-network
      - otel-network

  media_worker:
    image: ghcr.io/podcast-service/media_worker:${MEDIA_WORKER_TAG:-latest}
    container_name: media_worker
    env_file:
      - /home/deploy/.env
    environment:
      PODCAST_API_BASE_URL: ${PODCAST_API_BASE_URL:-http://podcast-core:8083/podcast/v1}
      OTEL_SERVICE_NAME: media_worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=podcast,deployment.environment=${DEPLOYMENT_ENV}
    expose:
      - "8082"
    volumes:
      - media-tmp:/tmp/media_uploads
    restart: unless-stopped
    networks:
      - podcast-network
      - otel-network

  tts_service:
    image: ghcr.io/podcast-service/tts_service:${TTS_SERVICE_TAG:-latest}
    container_name: tts_service
    env_file:
      - /home/deploy/.env
    environment:
      OTEL_SERVICE_NAME: tts_service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=tts,deployment.environment=${DEPLOYMENT_ENV}
    expose:
      - "8000"
    volumes:
      - tts-audio:/app/audio
    restart: unless-stopped
    networks:
      - podcast-network
      - otel-network

  podcast_core:
    image: ghcr.io/podcast-service/podcast_core:${PODCAST_CORE_TAG:-latest}
    container_name: podcast_core
    env_file:
      - /home/deploy/.env
    environment:
      PODCAST_AUTH_SERVICE_BASE_URL: http://auth_service:8080
      PODCAST_AUTH_SERVICE_CONNECT_TIMEOUT: 2s
      PODCAST_AUTH_SERVICE_READ_TIMEOUT: 5s
      OTEL_SERVICE_NAME: podcast_core
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=podcast,deployment.environment=${DEPLOYMENT_ENV}
    expose:
      - "8083"
    restart: unless-stopped
    networks:
      podcast-network:
        # Валидный по RFC alias без '_' для внутренних HTTP-вызовов к Tomcat.
        aliases:
          - podcast-core
      otel-network: {}

  speech_service:
    image: ghcr.io/podcast-service/speech_service:${SPEECH_SERVICE_TAG:-latest}
    container_name: speech_service
    env_file:
      - /home/deploy/.env
    environment:
      OTEL_SERVICE_NAME: speech_service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=podcast,deployment.environment=${DEPLOYMENT_ENV}
    volumes:
      - ${WHISPER_MODELS_PATH}:/models:ro
    restart: unless-stopped
    networks:
      - podcast-network
      - otel-network

  podcast_client:
    image: ghcr.io/podcast-service/podcast_client:${PODCAST_CLIENT_TAG:-latest}
    container_name: podcast_client
    restart: unless-stopped
    networks:
      - podcast-network

  email_service:
    image: ghcr.io/podcast-service/email_service:${EMAIL_SERVICE_TAG:-latest}
    container_name: email_service
    env_file:
      - /home/deploy/.env
    environment:
      OTEL_SERVICE_NAME: email_service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=podcast,deployment.environment=${DEPLOYMENT_ENV}
    restart: unless-stopped
    networks:
      - podcast-network
      - otel-network

  tts_service_worker:
    image: ghcr.io/podcast-service/tts_service:${TTS_SERVICE_TAG:-latest}
    container_name: tts_worker
    command: opentelemetry-instrument celery -A app.celery_app worker --loglevel=info -E --concurrency=1
    env_file:
      - /home/deploy/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_START: ${KAFKA_TOPIC_START}
      KAFKA_TOPIC_MEDIA_UPLOAD: ${KAFKA_TOPIC_MEDIA_UPLOAD}
      MEDIA_OBJECT_TYPE: ${MEDIA_OBJECT_TYPE}
      AUDIO_DIR: /app/audio
      CELERY_WORKER_PREFETCH_MULTIPLIER: 1
      CELERY_WORKER_MAX_TASKS_PER_CHILD: 200
      CELERY_WORKER_MAX_MEMORY_PER_CHILD: 900000
      CELERY_RESULT_EXPIRES_SECONDS: 3600
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_AUDIO_KEY_PREFIX: ${S3_AUDIO_KEY_PREFIX}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE}
      OTEL_SERVICE_NAME: tts-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=tts,service.version=1.0.0,deployment.environment=${DEPLOYMENT_ENV}
    volumes:
      - tts-audio:/app/audio
    restart: unless-stopped
    networks:
      - podcast-network
      - otel-network

  distribution_service:
    image: ghcr.io/podcast-service/distribution_service:${DISTRIBUTION_SERVICE_TAG:-latest}
    container_name: distribution_service
    env_file:
      - /home/deploy/.env
    environment:
      DATABASE_URL: ${DISTRIBUTION_DATABASE_URL}
      PUBLIC_BASE_URL: ${DISTRIBUTION_PUBLIC_BASE_URL}
      AUTH_SERVICE_URL: ${DISTRIBUTION_AUTH_SERVICE_URL}
      AUTH_INTERNAL_API_TOKEN: ${AUTH_INTERNAL_API_TOKEN}
      RUST_LOG: ${DISTRIBUTION_RUST_LOG}
      DB_MAX_CONNECTIONS: ${DISTRIBUTION_DB_MAX_CONNECTIONS}
      BIND_ADDR: 0.0.0.0:8788
      OTEL_SERVICE_NAME: distribution_service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=podcast,deployment.environment=${DEPLOYMENT_ENV}
    expose:
      - "8788"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8788/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - podcast-network
      - otel-network

networks:
  podcast-network:
    external: true
    name: podcast-network
  otel-network:
    external: true
    name: ot_collector_otel

volumes:
  media-tmp:
  tts-audio:
