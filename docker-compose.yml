services:
  auth_service:
    image: ghcr.io/podcast-service/auth_service:${AUTH_SERVICE_TAG:-latest}
    container_name: auth_service
    env_file:
      - /home/deploy/.env
    environment:
      OTEL_SERVICE_NAME: auth_service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=podcast,deployment.environment=${DEPLOYMENT_ENV}
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - podcast-network
      - otel-network

  media_upload_service:
    image: ghcr.io/podcast-service/media_upload_service:${MEDIA_UPLOAD_SERVICE_TAG:-latest}
    container_name: media_upload_service
    env_file:
      - /home/deploy/.env
    environment:
      OTEL_SERVICE_NAME: media_upload_service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=podcast,deployment.environment=${DEPLOYMENT_ENV}
    expose:
      - "8081"
    volumes:
      - media-tmp:/tmp/media_uploads
    restart: unless-stopped
    networks:
      - podcast-network
      - otel-network

  media_worker:
    image: ghcr.io/podcast-service/media_worker:${MEDIA_WORKER_TAG:-latest}
    container_name: media_worker
    env_file:
      - /home/deploy/.env
    environment:
      PODCAST_API_BASE_URL: ${MEDIA_WORKER_PODCAST_API_BASE_URL:-http://podcast-core:8083/podcast/v1}
      OTEL_SERVICE_NAME: media_worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=podcast,deployment.environment=${DEPLOYMENT_ENV}
    expose:
      - "8082"
    volumes:
      - media-tmp:/tmp/media_uploads
    restart: unless-stopped
    networks:
      - podcast-network
      - otel-network

  tts_service:
    image: ghcr.io/podcast-service/tts_service:${TTS_SERVICE_TAG:-latest}
    container_name: tts_service
    env_file:
      - /home/deploy/.env
    environment:
      OTEL_SERVICE_NAME: tts_service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=tts,deployment.environment=${DEPLOYMENT_ENV}
    expose:
      - "8000"
    volumes:
      - tts-audio:/app/audio
    restart: unless-stopped
    networks:
      - podcast-network
      - otel-network

  podcast_core:
    image: ghcr.io/podcast-service/podcast_core:${PODCAST_CORE_TAG:-latest}
    container_name: podcast_core
    env_file:
      - /home/deploy/.env
    environment:
      PODCAST_AUTH_SERVICE_BASE_URL: http://auth_service:8080
      PODCAST_AUTH_SERVICE_CONNECT_TIMEOUT: 2s
      PODCAST_AUTH_SERVICE_READ_TIMEOUT: 5s
      PODCAST_KAFKA_TOPIC_PODCAST_ACTIVITY_EVENTS: ${PODCAST_KAFKA_TOPIC_PODCAST_ACTIVITY_EVENTS}
      PODCAST_KAFKA_TOPIC_PODCAST_CONTENT_EVENTS: ${PODCAST_KAFKA_TOPIC_PODCAST_CONTENT_EVENTS}
      PODCAST_KAFKA_TOPIC_PODCAST_SEARCH_EVENTS: ${PODCAST_KAFKA_TOPIC_PODCAST_SEARCH_EVENTS}
      PODCAST_KAFKA_DLT_TOPIC_PODCAST_ACTIVITY_EVENTS: ${PODCAST_KAFKA_DLT_TOPIC_PODCAST_ACTIVITY_EVENTS}
      PODCAST_KAFKA_DLT_TOPIC_PODCAST_CONTENT_EVENTS: ${PODCAST_KAFKA_DLT_TOPIC_PODCAST_CONTENT_EVENTS}
      PODCAST_KAFKA_DLT_TOPIC_PODCAST_SEARCH_EVENTS: ${PODCAST_KAFKA_DLT_TOPIC_PODCAST_SEARCH_EVENTS}
      PODCAST_KAFKA_PRODUCER_ENABLED: ${PODCAST_KAFKA_PRODUCER_ENABLED}
      PODCAST_RECOMMENDATION_EVENTS_ENABLED: ${PODCAST_RECOMMENDATION_EVENTS_ENABLED}
      PODCAST_OUTBOX_PUBLISHER_ENABLED: ${PODCAST_OUTBOX_PUBLISHER_ENABLED}
      PODCAST_OUTBOX_BATCH_SIZE: ${PODCAST_OUTBOX_BATCH_SIZE}
      PODCAST_OUTBOX_PUBLISH_DELAY_MS: ${PODCAST_OUTBOX_PUBLISH_DELAY_MS}
      PODCAST_OUTBOX_MAX_RETRY_ATTEMPTS: ${PODCAST_OUTBOX_MAX_RETRY_ATTEMPTS}
      PODCAST_OUTBOX_PROCESSING_TIMEOUT_MS: ${PODCAST_OUTBOX_PROCESSING_TIMEOUT_MS}
      PODCAST_OUTBOX_SEND_TIMEOUT_MS: ${PODCAST_OUTBOX_SEND_TIMEOUT_MS}
      PODCAST_OPENROUTER_ENABLED: ${PODCAST_OPENROUTER_ENABLED}
      PODCAST_OPENROUTER_API_KEY: ${PODCAST_OPENROUTER_API_KEY}
      PODCAST_OPENROUTER_BASE_URL: ${PODCAST_OPENROUTER_BASE_URL}
      PODCAST_OPENROUTER_MODEL: ${PODCAST_OPENROUTER_MODEL}
      PODCAST_OPENROUTER_SITE_URL: ${PODCAST_OPENROUTER_SITE_URL}
      PODCAST_OPENROUTER_APP_TITLE: ${PODCAST_OPENROUTER_APP_TITLE}
      PODCAST_OPENROUTER_TEMPERATURE: ${PODCAST_OPENROUTER_TEMPERATURE}
      PODCAST_OPENROUTER_MAX_TOKENS: ${PODCAST_OPENROUTER_MAX_TOKENS}
      PODCAST_OPENROUTER_CONNECT_TIMEOUT: ${PODCAST_OPENROUTER_CONNECT_TIMEOUT}
      PODCAST_OPENROUTER_READ_TIMEOUT: ${PODCAST_OPENROUTER_READ_TIMEOUT}
      PODCAST_OPENROUTER_MAX_ATTEMPTS: ${PODCAST_OPENROUTER_MAX_ATTEMPTS}
      PODCAST_OPENROUTER_RETRY_BACKOFF: ${PODCAST_OPENROUTER_RETRY_BACKOFF}
      PODCAST_SUMMARY_DIRECT_MAX_CHARS: ${PODCAST_SUMMARY_DIRECT_MAX_CHARS}
      PODCAST_SUMMARY_CHUNK_SIZE_CHARS: ${PODCAST_SUMMARY_CHUNK_SIZE_CHARS}
      PODCAST_SUMMARY_SYSTEM_PROMPT: ${PODCAST_SUMMARY_SYSTEM_PROMPT}
      PODCAST_SUMMARY_DIRECT_PROMPT: ${PODCAST_SUMMARY_DIRECT_PROMPT}
      PODCAST_SUMMARY_CHUNK_PROMPT: ${PODCAST_SUMMARY_CHUNK_PROMPT}
      PODCAST_SUMMARY_FINAL_PROMPT: ${PODCAST_SUMMARY_FINAL_PROMPT}
      PODCAST_SUBTITLE_STORAGE_BASE_URL: ${PODCAST_SUBTITLE_STORAGE_BASE_URL}
      PODCAST_SUBTITLE_STORAGE_CONNECT_TIMEOUT: ${PODCAST_SUBTITLE_STORAGE_CONNECT_TIMEOUT}
      PODCAST_SUBTITLE_STORAGE_READ_TIMEOUT: ${PODCAST_SUBTITLE_STORAGE_READ_TIMEOUT}
      OTEL_SERVICE_NAME: podcast_core
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=podcast,deployment.environment=${DEPLOYMENT_ENV}
    expose:
      - "8083"
    restart: unless-stopped
    networks:
      podcast-network:
        # Валидный по RFC alias без '_' для внутренних HTTP-вызовов к Tomcat.
        aliases:
          - podcast-core
      otel-network: {}

  podcast_client:
    image: ghcr.io/podcast-service/podcast_client:${PODCAST_CLIENT_TAG:-latest}
    container_name: podcast_client
    restart: unless-stopped
    networks:
      - podcast-network

  recommendation_service:
    image: ghcr.io/podcast-service/recommendation_service:${RECOMMENDATION_SERVICE_TAG:-latest}
    container_name: recommendation_service
    env_file:
      - /home/deploy/.env
    environment:
      SERVER_PORT: 8085
      RECOMMENDATION_DB_URL: jdbc:postgresql://recommendation-db:5432/${RECOMMENDATION_DB_NAME}
      RECOMMENDATION_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RECOMMENDATION_JWT_SECRET: ${RECOMMENDATION_JWT_SECRET}
      RECOMMENDATION_CORS_ALLOWED_ORIGINS: ${RECOMMENDATION_CORS_ALLOWED_ORIGINS}
      OTEL_SERVICE_NAME: recommendation_service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=podcast,deployment.environment=${DEPLOYMENT_ENV}
    expose:
      - "8085"
    restart: unless-stopped
    networks:
      podcast-network:
        aliases:
          - recommendation-core
      otel-network: {}

  email_service:
    image: ghcr.io/podcast-service/email_service:${EMAIL_SERVICE_TAG:-latest}
    container_name: email_service
    env_file:
      - /home/deploy/.env
    environment:
      OTEL_SERVICE_NAME: email_service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=podcast,deployment.environment=${DEPLOYMENT_ENV}
    restart: unless-stopped
    networks:
      - podcast-network
      - otel-network

  distribution_service:
    image: ghcr.io/podcast-service/distribution_service:${DISTRIBUTION_SERVICE_TAG:-latest}
    container_name: distribution_service
    env_file:
      - /home/deploy/.env
    environment:
      DATABASE_URL: ${DISTRIBUTION_DATABASE_URL}
      PUBLIC_BASE_URL: ${DISTRIBUTION_PUBLIC_BASE_URL}
      AUTH_SERVICE_URL: ${DISTRIBUTION_AUTH_SERVICE_URL}
      AUTH_INTERNAL_API_TOKEN: ${AUTH_INTERNAL_API_TOKEN}
      RUST_LOG: ${DISTRIBUTION_RUST_LOG}
      DB_MAX_CONNECTIONS: ${DISTRIBUTION_DB_MAX_CONNECTIONS}
      BIND_ADDR: 0.0.0.0:8788
      OTEL_SERVICE_NAME: distribution_service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=podcast,deployment.environment=${DEPLOYMENT_ENV}
    expose:
      - "8788"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8788/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - podcast-network
      - otel-network

networks:
  podcast-network:
    external: true
    name: podcast-network
  otel-network:
    external: true
    name: ot_collector_otel

volumes:
  media-tmp:
  tts-audio:
