services:
  auth_service:
    image: ghcr.io/podcast-service/auth_service:${AUTH_SERVICE_TAG:-latest}
    container_name: auth_service

    env_file:
      - /home/deploy/.env

    expose:
      - "8080"

    restart: unless-stopped

    networks:
      - podcast-network
  media_upload_service:
    image: ghcr.io/podcast-service/media_upload_service:${MEDIA_UPLOAD_SERVICE_TAG:-latest}
    container_name: media_upload_service
    env_file:
      - /home/deploy/.env
    expose:
      - "8081"
    volumes:
      - media-tmp:/tmp/media_uploads
    restart: unless-stopped
    networks:
      - podcast-network

  media_worker:
    image: ghcr.io/podcast-service/media_worker:${MEDIA_WORKER_TAG:-latest}
    container_name: media_worker
    env_file:
      - /home/deploy/.env
    expose:
      - "8082"
    volumes:
      - media-tmp:/tmp/media_uploads
    restart: unless-stopped
    networks:
      - podcast-network
    
  tts_service:
    image: ghcr.io/podcast-service/tts_service:${TTS_SERVICE_TAG:-latest}
    container_name: tts_service
    env_file:
      - /home/deploy/.env
    expose:
      - "8000"
    volumes:
      - tts-audio:/app/audio
    restart: unless-stopped
    networks:
      - podcast-network

  podcast_core:
    image: ghcr.io/podcast-service/podcast_core:${PODCAST_CORE_TAG:-latest}
    container_name: podcast_core
    env_file:
      - /home/deploy/.env
    expose:
      - "8083"
    restart: unless-stopped
    networks:
      - podcast-network
  speech_service:
    image: ghcr.io/podcast-service/speech_service:${SPEECH_SERVICE_TAG:-latest}
    container_name: speech_service
    env_file:
      - /home/deploy/.env
    volumes:
      - ${WHISPER_MODELS_PATH}:/models:ro
    restart: unless-stopped
    networks:
      - podcast-network  
  podcast_client:
    image: ghcr.io/podcast-service/podcast_client:${PODCAST_CLIENT_TAG:-latest}
    container_name: podcast_client
    restart: unless-stopped
    networks:
      - podcast-network
   
  email_service:
    image: ghcr.io/podcast-service/email_service:${EMAIL_SERVICE_TAG:-latest}
    container_name: email_service
    env_file:
      - /home/deploy/.env
    restart: unless-stopped
    networks:
      - podcast-network

  distribution_service:
    image: ghcr.io/podcast-service/distribution_service:${DISTRIBUTION_SERVICE_TAG:-latest}
    container_name: distribution_service
    env_file:
      - /home/deploy/.env
    environment:
      DATABASE_URL: postgres://${PODCAST_DB_USER}:${PODCAST_DB_PASSWORD}@podcast-db:5432/${PODCAST_DB}
      BIND_ADDR: 0.0.0.0:8788
      PUBLIC_BASE_URL: ${DISTRIBUTION_PUBLIC_BASE_URL:-http://186.246.30.30}
      AUTH_SERVICE_URL: http://auth_service:8080/auth
      AUTH_INTERNAL_API_TOKEN: ${AUTH_INTERNAL_API_TOKEN:-}
      AUTH_CACHE_TTL_SECONDS: ${AUTH_CACHE_TTL_SECONDS:-3600}
      RUST_LOG: ${DISTRIBUTION_RUST_LOG:-distribution_service=info,tower_http=warn,sqlx=warn}
    expose:
      - "8788"
    restart: unless-stopped
    networks:
      - podcast-network

networks:
  podcast-network:
    external: true
    name: podcast-network

volumes:
  media-tmp:
  tts-audio:  