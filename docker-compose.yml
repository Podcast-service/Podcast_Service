services:
  auth_service:
    image: malblsh/auth_service:${AUTH_SERVICE_TAG:-latest}
    container_name: auth_service

    env_file:
      - /home/deploy/.env

    expose:
      - "8080"

    restart: unless-stopped

    networks:
      - podcast-network
  media_upload_service:
    image: malblsh/media_upload_service:${MEDIA_UPLOAD_SERVICE_TAG:-latest}
    container_name: media_upload_service
    env_file:
      - /home/deploy/.env
    expose:
      - "8081"
    volumes:
      - media-tmp:/tmp/media_uploads
    restart: unless-stopped
    networks:
      - podcast-network

  media_worker:
    image: malblsh/media_worker:${MEDIA_WORKER_TAG:-latest}
    container_name: media_worker
    env_file:
      - /home/deploy/.env
    expose:
      - "8082"
    volumes:
      - media-tmp:/tmp/media_uploads
    restart: unless-stopped
    networks:
      - podcast-network

  speech_service:
    image: malblsh/speech_service:${SPEECH_SERVICE_TAG:-latest}
    container_name: speech_service
    env_file:
      - /home/deploy/.env
    volumes:
      - ${WHISPER_MODELS_PATH}:/models:ro
    restart: unless-stopped
    networks:
      - podcast-network  
  podcast_client:
    image: malblsh/podcast_client:${PODCAST_CLIENT_TAG:-latest}
    container_name: podcast_client
    restart: unless-stopped
    networks:
      - podcast-network        

networks:
  podcast-network:
    external: true
    name: podcast-network

volumes:
  media-tmp: